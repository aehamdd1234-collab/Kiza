
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiza | كيزا</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#101827;color:white}
header{padding:20px;text-align:center;background:#172338;border-bottom:1px solid #334155}
h1{margin:0;color:#60a5fa;font-size:30px}
header p{color:#cbd5e1;font-size:13px}
#chat{height:calc(100dvh - 190px);overflow-y:auto;padding:18px}
.message{padding:13px;margin:12px 0;border-radius:16px;max-width:85%;line-height:1.7;overflow-wrap:anywhere}
.bot{background:#273449;margin-left:auto}
.user{background:#2563eb;margin-right:auto}
footer{position:fixed;bottom:0;width:100%;background:#172338;padding:14px;display:flex;gap:8px}
input{flex:1;min-width:0;border:0;border-radius:12px;padding:14px;font-size:16px}
button{border:0;border-radius:12px;background:#3b82f6;color:white;padding:12px;font-size:16px}
</style>
</head>
<body>
<header><h1>Kiza ✦ كيزا</h1><p>مساعدك الذكي باللغة العربية</p></header>
<main id="chat"><div class="message bot">أهلاً بك! أنا كيزا. كيف يمكنني مساعدتك اليوم؟</div></main>
<footer>
<input id="msg" placeholder="اكتب رسالتك هنا...">
<button onclick="send()">إرسال</button>
</footer>
<script>
function send(){
const input=document.getElementById('msg');
const value=input.value.trim();
if(!value)return;
const chat=document.getElementById('chat');
const bubble=document.createElement('div');
bubble.className='message user';
bubble.textContent=value;
chat.appendChild(bubble);
input.value='';
chat.scrollTop=chat.scrollHeight;
}
document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
